name: Deterministic Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tree-gate:
    name: Tree gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/tree-gate
      - id: gate
        uses: ./.github/actions/tree-gate

  deterministic-build-device:
    name: Deterministic Build Device Firmware
    runs-on: ubuntu-latest
    needs: tree-gate
    if: needs.tree-gate.outputs.skip != 'true'
    # This job is allowed to fail and won't block PRs
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/fetch-cargo-deps
      - uses: "./.github/actions/install-cargo-bins"
      - uses: "./.github/actions/cache-rust-target"
        with:
          key: "build-device-firmware-deterministic-frontier"
          path: "/var/tmp/frostsnap/target/riscv32imc-unknown-none-elf/release"
      - name: Build Firmware Deterministically
        run: |
          chmod +x device/deterministic-build.sh
          just build-deterministic
      - name: Display Build Info
        run: |
          echo "Build complete"
          echo "Size: $(stat -c%s /var/tmp/frostsnap/target/riscv32imc-unknown-none-elf/release/frontier.bin) bytes"
          echo "SHA256: $(sha256sum /var/tmp/frostsnap/target/riscv32imc-unknown-none-elf/release/frontier.bin)"
      - uses: "./.github/actions/upload-artifact"
        with:
          name: frostsnap-frontier-deterministic-${{ github.sha }}.bin
          path: /var/tmp/frostsnap/target/riscv32imc-unknown-none-elf/release/frontier.bin
      # A step after a failure is skipped even under job-level continue-on-error, so only a real
      # pass records the marker.
      - uses: ./.github/actions/tree-gate
        with:
          record: "true"
