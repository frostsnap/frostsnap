[package]
name = "rust_lib_frostsnapp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1"
frostsnap_coordinator = { workspace = true }
frostsnap_core = { workspace = true }
lazy_static = "1.4"
tracing-subscriber = { version = "0.3" }
tracing = { workspace = true, features = ["std"] }
bincode.workspace = true
rqrr = "0.10.0"
bitcoin.workspace = true
image = "0.25"
ur = { git = "https://github.com/nickfarrow/ur-rs", rev = "2e267e5e019b6c8129f66efba00327ff3d0ae5a4" }
rusqlite = "0.31.0"
sha2.workspace = true
rand = "0.8"
time = { version = "0.3.36", features = ["formatting"] }
bip21 = {version = "0.5.0", default-features = false}
futures.workspace = true
# Ark boarding (beta, signet only) — see src/api/ark.rs
bark-wallet = { version = "0.7.1", default-features = false, features = ["rand", "sqlite", "native", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { workspace = true }
serde_json = "1"

[build-dependencies]
frostsnap_secure_boot.workspace = true

[dependencies.flutter_rust_bridge]
version = "=2.11.1"
default-features = false
# explicit features since we don't want the `log` feature
features = [
    "anyhow",
    "dart-opaque",
    "portable-atomic",
    "rust-async",
    "thread-pool",
    "user-utils",
]

[target.'cfg(target_os = "android")'.dependencies]
tracing-logcat = "0.1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
frostsnap_desktop_camera = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
