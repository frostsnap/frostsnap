[package]
name = "frost_backup"
version = "0.1.0"
edition = "2021"

[dependencies]
schnorr_fun = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true, default-features = false }
rand_core = { workspace = true }
# The card's bit proofs are stock sigma_fun proofs, so this version fixes their format.
sigma_fun = { version = "=0.9.0", default-features = false, features = ["secp256k1"] }
rand_chacha = { workspace = true }

# optional
rand = { workspace = true, optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
bitcoin = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
miniscript = { version = "12.3", optional = true }

[features]
cli = [
    "offline-repair",
    "clap",
    "std",
    "rand",
    "bitcoin",
    "miniscript",
]

std = [
    "schnorr_fun/std",
    "sha2/std",
    "bitcoin?/std",
]

default = ["cli"]

# The offline repair tool's decode, which may ignore the masks (spec PK.8 escape hatch, owner
# B13). Never for firmware: a restore whose words 33-64 came from a phone needs the masks.
offline-repair = []

bincode = [
    "dep:bincode",
    "schnorr_fun/bincode"
]

[[bin]]
name = "frost_backup"
required-features = ["cli"]

[[bin]]
name = "card_offline_recover"
required-features = ["cli"]

[dev-dependencies]
proptest = { workspace = true }
secp256kfun = { workspace = true, features = ["proptest"] }
rand = { workspace = true }
miniscript = { version = "12.3" }
frostsnap_core = { workspace = true }
frostsnap_coordinator = { workspace = true }
bitcoin = { workspace = true }