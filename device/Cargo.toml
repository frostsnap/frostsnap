[package]
name = "frostsnap_device"
version = "0.1.0"
authors = ["nickfarrow <nick@nickfarrow.com>"]
edition = "2021"

[features]
default = ["stack_guard"]
mem_debug = []
debug_fps = []
debug_mem = []
debug_log = []
debug = [ "debug_fps", "debug_mem", "debug_log" ]
prefill-words = []
# turns on the esp32c3 hardware stack guard
stack_guard = []
# FIXME: remove this feature when v2.rs is deleted (only used in legacy factory code)
genuine_device = []
# the heap's high-water mark in the card job log lines (costs time on every alloc)
card_heap_stats = ["esp-alloc/internal-heap-stats"]
# the card-timing bench build: keeps every card job log line (the encode, the seal, the proofs,
# each opening, the restore decode: wall clock, compute, slices, longest slice) and times one
# encode and two worst-case restore repairs at boot, sent upstream as debug lines once no card
# flow is live. Job timings follow the user's touches: never ship it, and use it only with a
# disposable wallet.
card-timing = []

[dependencies]
frostsnap_core = { workspace = true }
frostsnap_comms = { workspace = true }
frostsnap_embedded = { workspace = true }
frost_backup = { workspace = true, features = ["bincode"] }
bitcoin.workspace = true
esp-hal = { workspace = true, features = ["esp32c3", "rt"] }
rand_core.workspace = true
esp-alloc = { workspace = true, features = ["esp32c3"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c3"] }
nb = "1"
heapless = "0.8"
critical-section = "1.2"
embedded-hal-bus = "0.3"
embedded-hal.workspace = true
embedded-storage.workspace = true
esp-storage = { workspace = true, features = ["esp32c3", "bytewise-read", "embedded-storage"] }
bincode = { workspace = true }
mipidsi = { version = "0.10", features = ["batch"] }
embedded-graphics = "0.8.1"
rand_chacha = { workspace = true }
frostsnap_cst816s = { workspace = true }
crc.workspace = true
reed-solomon = "0.2.1"
frostsnap_widgets = { workspace = true }
frostsnap_macros = { path = "../macros" }

[[bin]]
name = "legacy"
path = "src/bin/legacy.rs"

[[bin]]
name = "frontier"
path = "src/bin/frontier.rs"

[[bin]]
name = "widget_dev"
